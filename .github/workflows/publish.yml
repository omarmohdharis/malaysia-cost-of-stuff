name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  # Re-render on the 5th of each month — data.gov.my typically publishes
  # the previous month's PriceCatcher data in the first few days of the new month.
  schedule:
    - cron: '0 6 5 * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pandas pyarrow plotly numpy

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "chore: auto-publish ${{ github.run_id }}"
